# Run-only stack for the Raspberry Pi. Images are built elsewhere and loaded in,
# so the Pi needs neither the source nor a toolchain — building on it takes about
# an hour and a half, against a couple of minutes on a desktop.
#
# Deploy with scripts/deploy.sh from a development machine. To operate it on the
# Pi afterwards:
#
#   docker compose up -d          # start (or restart after loading new images)
#   docker compose logs -f api    # follow the device requests
#   docker compose down           # stop, keeping the database
#
# There is deliberately no `build:` section: `up` can never start a build here.
#
# Shares its project name with docker-compose.prod.yml on purpose: the two describe
# the same production stack, differing only in whether the images are built here or
# brought in. Deploying therefore replaces a stack started from the other file and
# keeps its database, instead of colliding with it over the container names.
name: pixoo-prod

services:
  db:
    image: postgres:17-alpine
    container_name: pixoo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixoo}
      POSTGRES_DB: ${POSTGRES_DB:-pixoo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pixoo} -d ${POSTGRES_DB:-pixoo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: pixoo-api:prod
    container_name: pixoo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixoo}:${POSTGRES_PASSWORD:-pixoo}@db:5432/${POSTGRES_DB:-pixoo}
      PORT: 3001
      WEB_ORIGIN: http://${PIXOO_HOST:-localhost}:${WEB_PORT:-3000}
      TZ: ${TZ:-Asia/Tokyo}
      PIXOO_REQUEST_INTERVAL_MS: ${PIXOO_REQUEST_INTERVAL_MS:-2000}
      PIXOO_REQUEST_TIMEOUT_MS: ${PIXOO_REQUEST_TIMEOUT_MS:-30000}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    # PIXOO_HOST is compiled into this image rather than read from the environment,
    # so changing it means rebuilding and redeploying, not just restarting.
    image: pixoo-web:prod
    container_name: pixoo-web
    restart: unless-stopped
    environment:
      API_URL: http://api:3001/api
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
