# Production stack, intended for a Raspberry Pi on the same LAN as the Pixoo64.
#
# Differs from docker-compose.yml in three ways that matter on a small machine:
# it builds the `production` stage, mounts no source, and runs no file watchers —
# the development stack keeps a TypeScript watcher and a Next.js dev server alive,
# which is far more memory than a 1 GB Pi has to spare.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Its own project name and image tags keep it from colliding with the development
# stack, which would otherwise share both and overwrite them on each build.
name: pixoo-prod

services:
  db:
    image: postgres:17-alpine
    container_name: pixoo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixoo}
      POSTGRES_DB: ${POSTGRES_DB:-pixoo}
    # Not published: only the api talks to it, over the compose network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pixoo} -d ${POSTGRES_DB:-pixoo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: production
    image: pixoo-api:prod
    container_name: pixoo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixoo}:${POSTGRES_PASSWORD:-pixoo}@db:5432/${POSTGRES_DB:-pixoo}
      PORT: 3001
      WEB_ORIGIN: http://${PIXOO_HOST:-localhost}:${WEB_PORT:-3000}
      # Weekdays and 10-minute slots are wall-clock local time.
      TZ: ${TZ:-Asia/Tokyo}
      PIXOO_REQUEST_INTERVAL_MS: ${PIXOO_REQUEST_INTERVAL_MS:-500}
      PIXOO_REQUEST_TIMEOUT_MS: ${PIXOO_REQUEST_TIMEOUT_MS:-30000}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: production
      args:
        # Read by the browser, so it must be an address the browser can reach —
        # the Pi's, not the container's. Inlined at build time, which is why it is
        # a build argument rather than an environment variable.
        NEXT_PUBLIC_API_URL: http://${PIXOO_HOST:-localhost}:${API_PORT:-3001}/api
    image: pixoo-web:prod
    container_name: pixoo-web
    restart: unless-stopped
    environment:
      # Read by Next.js server components, which resolve over the compose network.
      API_URL: http://api:3001/api
      TZ: ${TZ:-Asia/Tokyo}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
