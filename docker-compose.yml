services:
  db:
    image: postgres:17-alpine
    container_name: pixoo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixoo}
      POSTGRES_DB: ${POSTGRES_DB:-pixoo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pixoo} -d ${POSTGRES_DB:-pixoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      target: development
    container_name: pixoo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pixoo}:${POSTGRES_PASSWORD:-pixoo}@db:5432/${POSTGRES_DB:-pixoo}
      PORT: 3001
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      # Weekdays and 10-minute slots are wall-clock local time, so the container
      # must not run on UTC.
      TZ: ${TZ:-Asia/Tokyo}
      # Pause between consecutive requests to the device. Raise it if the display
      # drops a layer (for example text vanishing behind an animation).
      PIXOO_REQUEST_INTERVAL_MS: ${PIXOO_REQUEST_INTERVAL_MS:-2000}
      # How long to wait for the device to answer. It processes a request before
      # replying, and a 60-frame background takes it about six seconds.
      PIXOO_REQUEST_TIMEOUT_MS: ${PIXOO_REQUEST_TIMEOUT_MS:-30000}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./apps/api:/app
      # Keep the container's own install; the host's is built for the host platform.
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: development
    container_name: pixoo-web
    restart: unless-stopped
    environment:
      # Both point at the API's /api prefix, so callers just append the route.
      # Read from the browser, so it must be a host-visible URL.
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}/api
      # Read from Next.js server components, which resolve over the compose network.
      API_URL: http://api:3001/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:
